name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Deploy to QA? Type "qa" to confirm'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && 'Manual QA Deployment' || 'Auto Dev Deployment' }}

jobs:
  deploy-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      STAGE: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install -g aws-cdk
      - run: STAGE=$STAGE npx cdk synth

      - uses: actions/upload-artifact@v4
        with:
          name: cdk-template-dev
          path: cdk.out/

  deploy-qa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      STAGE: qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm install -g aws-cdk
      - run: STAGE=$STAGE npx cdk synth

      - uses: actions/upload-artifact@v4
        with:
          name: cdk-template-qa
          path: cdk.out/