name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: CDK Synth
        run: STAGE=$STAGE npx cdk synth

      - name: Upload template artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdk-template-${{ env.STAGE }}
          path: cdk.out/